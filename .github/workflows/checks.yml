# C1 (owner approved, 15 Oct): every push and pull request runs all the checks. Also weekly, so a red check shows up
# even when nothing is pushed. Actions pinned to exact commits (S2). Step I phase C8 (owner, 26 Nov 2026): the slow v2
# measurement (`npm run test:sim`) went with the v2 engine; the v3 games are checked against the simulator game by game
# in `npm test` (test/v3-equivalence.test.ts).
name: Checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # C3: the game in a real browser (whole games checked against the engine, every screen size, the published build)
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
