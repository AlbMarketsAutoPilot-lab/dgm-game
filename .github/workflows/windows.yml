# The Windows app (owner approved, 18 Oct 2026): builds it into the Microsoft Store upload file (.msixupload), so the
# owner needs no Visual Studio. The same as the owner's KAJ app, made from Microsoft's "Set up continuous integration
# for your WinUI app" (Store bundle workflow). Unsigned: the Microsoft Store signs the package after submission.
# Download it from the run's "dgm-windows-store" artifact. Actions pinned to exact commits (S2).
name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      Solution_Name: windows\DGM.sln
      Configuration: Release
      Bundle_Platforms: x86|x64|ARM64
      Appx_Package_Dir: Packages\
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build the game into the app
        run: npm run windows:assets
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Restore the app
        run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      - name: Build the Store package
        run: >
          msbuild $env:Solution_Name
          /p:Configuration=$env:Configuration
          /p:Platform=x64
          /p:AppxBundlePlatforms="$env:Bundle_Platforms"
          /p:AppxBundle=Always
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxPackageDir="$env:Appx_Package_Dir"
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dgm-windows-store
          path: '**/Packages/*.msixupload'
          if-no-files-found: error
          retention-days: 14
