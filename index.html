<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Don't Get Mad!</title>
    <style>
      :root { --paper: #f7f1e3; --ink: #4b2377; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #d9cdb3; color: var(--ink); font-family: "Patrick Hand", "Comic Sans MS", cursive; }
      body { display: flex; flex-direction: column; }
      header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; background: var(--paper); border-bottom: 2px solid var(--ink); }
      header h1 { font-size: 1.4rem; margin: 0 12px 0 0; font-weight: normal; }
      button { font: inherit; font-size: 1.1rem; min-height: 44px; padding: 4px 16px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); color: var(--ink); cursor: pointer; }
      button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
      #view { flex: 1; overflow: auto; }
      #view canvas { display: block; margin: 0 auto; }
    </style>
  </head>
  <body>
    <header>
      <h1>Don't Get Mad!</h1>
      <button data-board="long" aria-pressed="true">The Grand Journey</button>
      <button data-board="short" aria-pressed="false">The Quick Trip</button>
      <button id="fit" aria-pressed="false">Fit to screen</button>
    </header>
    <div id="view"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
